name: Deploy to srv01

# Runs only for pushes to master. Pull requests and other branches never
# get here, so they can never reach the secrets or the server.
on:
  push:
    branches: [master]

permissions:
  contents: read
  id-token: write   # lets the job ask GitHub for a short-lived identity token (Tailscale uses it)

# One deploy at a time. A second push waits instead of overlapping.
concurrency:
  group: deploy-srv01
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04   # pinned: the "latest" label is moving to a newer release
    timeout-minutes: 15
    env:
      SRV_HOST: 100.100.166.29   # srv01 on the tailnet
      SRV_USER: deploy
    steps:
      - name: Check out the code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      # srv.json stays the single source of truth, the same file `srv deploy` reads.
      # It has two forms: a single static site ("type": "static"), or "components" (a php backend and/or a static
      # frontend), which are built, uploaded and switched live together, in the listed order.
      - name: Read srv.json
        run: |
          set -euo pipefail
          name="$(jq -er .name srv.json)"
          site="$(jq -er .host srv.json)"
          [[ "$name" =~ ^[a-z0-9][a-z0-9-]{0,40}$ ]] || { echo "bad name in srv.json" >&2; exit 1; }
          [[ "$site" =~ ^[a-z0-9]([a-z0-9.-]{0,60}[a-z0-9])?$ ]] || { echo "bad host in srv.json" >&2; exit 1; }
          if jq -e 'has("components")' srv.json > /dev/null; then
            if jq -e 'has("type") or has("output") or has("build") or has("workdir")' srv.json > /dev/null; then
              echo "srv.json mixes components with the single-site fields (type, output, build, workdir): use one form" >&2; exit 1
            fi
            form=group
          else
            jq -e '.type == "static"' srv.json > /dev/null || { echo "srv.json needs type static, or components" >&2; exit 1; }
            form=single
          fi
          {
            echo "SRV_NAME=$name"
            echo "SRV_SITE=$site"
            echo "SRV_FORM=$form"
          } >> "$GITHUB_ENV"

      # CI=false makes the build behave like `srv deploy` on the PC
      # (react-scripts turns warnings into errors when CI is true).
      # The php build (for example composer install) runs on the runner, which has php and composer installed.
      - name: Build and package
        env:
          CI: "false"
        run: |
          set -euo pipefail
          REL="$(date -u +%Y%m%d-%H%M%S)-$(git rev-parse --short=7 HEAD)"
          tgz="$RUNNER_TEMP/site.tgz"

          # export the build variables of srv.json section $1 (a jq path such as '.' or '.components[0]')
          export_env() {
            local kv
            while IFS= read -r kv; do export "$kv"; done < <(jq -r "($1.env // {}) | to_entries[] | \"\(.key)=\(.value)\"" srv.json)
          }

          if [ "$SRV_FORM" = single ]; then
            workdir="$(jq -r '.workdir // "."' srv.json)"
            build="$(jq -er .build srv.json)"
            output="$(jq -er .output srv.json)"        # relative to the repository root in this form
            ( export_env '.'; cd "$workdir"; npm ci; bash -c "$build" )
            test -f "$output/index.html"
            tar -czf "$tgz" -C "$output" .
            REQ="ci-deploy $SRV_NAME $REL $SRV_SITE"
          else
            stage="$RUNNER_TEMP/stage"; rm -rf "$stage"; mkdir -p "$stage"
            n="$(jq '.components | length' srv.json)"
            [ "$n" -ge 1 ] && [ "$n" -le 2 ] || { echo "components needs one or two entries" >&2; exit 1; }
            types=(); seen=","
            for i in $(seq 0 $((n - 1))); do
              c=".components[$i]"
              t="$(jq -er "$c.type" srv.json)"
              p="$(jq -er "$c.path" srv.json)"
              [[ "$t" == static || "$t" == php ]] || { echo "unsupported component type: $t" >&2; exit 1; }
              [[ "$seen" != *",$t,"* ]] || { echo "two components of type $t" >&2; exit 1; }
              seen+="$t,"
              [[ "$p" =~ ^[A-Za-z0-9._/-]+$ && "$p" != /* ]] || { echo "bad path: $p" >&2; exit 1; }
              if [[ "$p" =~ (^|/)\.\.(/|$) ]]; then echo "bad path: $p" >&2; exit 1; fi
              [ -d "$p" ] || { echo "folder $p does not exist" >&2; exit 1; }
              build="$(jq -r "$c.build // empty" srv.json)"
              if [ "$t" = static ]; then
                out="$(jq -er "$c.output" srv.json)"     # relative to the component's path in this form
                [ -n "$build" ] || { echo "the static component needs build" >&2; exit 1; }
                ( export_env "$c"; cd "$p"; npm ci; bash -c "$build"; test -f "$out/index.html" )
                mkdir -p "$stage/static"
                cp -a "$p/$out/." "$stage/static/"
              else
                ( export_env "$c"; cd "$p"; if [ -n "$build" ]; then bash -c "$build"; fi; test -f public/index.php )
                mkdir -p "$stage/php"
                # only these folders go up; config/ never does (the server provides config.php)
                for d in public private src vendor; do
                  if [ -d "$p/$d" ]; then cp -a "$p/$d" "$stage/php/$d"; fi
                done
              fi
              types+=("$t")
            done
            typelist="$(IFS=,; echo "${types[*]}")"
            tar -czf "$tgz" -C "$stage" "${types[@]}"
            REQ="ci-deploy-group $SRV_NAME $REL $SRV_SITE $typelist"
          fi

          ls -l "$tgz"
          # REQ is made only from values validated above (name, release id, host, type list).
          { echo "SRV_REL=$REL"; echo "SRV_REQUEST=$REQ"; } >> "$GITHUB_ENV"

      # The runner joins the tailnet as a temporary node tagged tag:ci.
      # The Tailscale policy lets that tag reach srv01 on port 22 only.
      - name: Connect to the tailnet
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci

      - name: Wait for srv01
        run: |
          for i in $(seq 1 15); do
            if timeout 3 bash -c "exec 3<>/dev/tcp/$SRV_HOST/22"; then echo "srv01 reachable"; exit 0; fi
            sleep 3
          done
          echo "srv01 not reachable over the tailnet" >&2
          exit 1

      # The key can only run srv-ci-gate on the server. The host key is pinned,
      # so the upload goes only to the real srv01.
      - name: Upload and activate
        env:
          CI_KEY: ${{ secrets.SRV_CI_KEY }}
          HOST_KEY: "100.100.166.29 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMHWw7UWvcbJfPVy57VlAjpMtaABwVvFfGhPFOcwqYkB"
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$CI_KEY" | tr -d '\r' > "$HOME/.ssh/ci_key"
          printf '%s\n' "$HOST_KEY" > "$HOME/.ssh/known_hosts"
          echo "deploying: $SRV_REQUEST"
          ssh -i "$HOME/.ssh/ci_key" \
              -o IdentitiesOnly=yes -o BatchMode=yes \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              -o ConnectTimeout=20 \
              "$SRV_USER@$SRV_HOST" "$SRV_REQUEST" \
              < "$RUNNER_TEMP/site.tgz"
          echo "deployed $SRV_NAME $SRV_REL"

      - name: Remove the key
        if: always()
        run: rm -f "$HOME/.ssh/ci_key"
