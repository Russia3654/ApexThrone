name: Deploy to srv01

# Runs only for pushes to master. Pull requests and other branches never
# get here, so they can never reach the secrets or the server.
on:
  push:
    branches: [master]

permissions:
  contents: read
  id-token: write   # lets the job ask GitHub for a short-lived identity token (Tailscale uses it)

# One deploy at a time. A second push waits instead of overlapping.
concurrency:
  group: deploy-srv01
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SRV_HOST: 100.100.166.29   # srv01 on the tailnet
      SRV_USER: deploy
    steps:
      - name: Check out the code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      # srv.json stays the single source of truth, the same file `srv deploy` reads.
      - name: Read srv.json
        run: |
          set -euo pipefail
          jq -e '.type == "static"' srv.json > /dev/null
          {
            echo "SRV_NAME=$(jq -er .name srv.json)"
            echo "SRV_SITE=$(jq -er .host srv.json)"
            echo "SRV_WORKDIR=$(jq -r '.workdir // "."' srv.json)"
            echo "SRV_BUILD=$(jq -er .build srv.json)"
            echo "SRV_OUTPUT=$(jq -er .output srv.json)"
            jq -r '.env // {} | to_entries[] | "\(.key)=\(.value)"' srv.json
          } >> "$GITHUB_ENV"

      # CI=false makes the build behave like `srv deploy` on the PC
      # (react-scripts turns warnings into errors when CI is true).
      - name: Build
        working-directory: ${{ env.SRV_WORKDIR }}
        env:
          CI: "false"
        run: |
          set -euo pipefail
          npm ci
          bash -c "$SRV_BUILD"

      - name: Package
        run: |
          set -euo pipefail
          test -f "$SRV_OUTPUT/index.html"
          echo "SRV_REL=$(date -u +%Y%m%d-%H%M%S)-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"
          tar -czf "$RUNNER_TEMP/site.tgz" -C "$SRV_OUTPUT" .
          ls -l "$RUNNER_TEMP/site.tgz"

      # The runner joins the tailnet as a temporary node tagged tag:ci.
      # The Tailscale policy lets that tag reach srv01 on port 22 only.
      - name: Connect to the tailnet
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci

      - name: Wait for srv01
        run: |
          for i in $(seq 1 15); do
            if timeout 3 bash -c "exec 3<>/dev/tcp/$SRV_HOST/22"; then echo "srv01 reachable"; exit 0; fi
            sleep 3
          done
          echo "srv01 not reachable over the tailnet" >&2
          exit 1

      # The key can only run srv-ci-gate on the server. The host key is pinned,
      # so the upload goes only to the real srv01.
      - name: Upload and activate
        env:
          CI_KEY: ${{ secrets.SRV_CI_KEY }}
          HOST_KEY: "100.100.166.29 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMHWw7UWvcbJfPVy57VlAjpMtaABwVvFfGhPFOcwqYkB"
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$CI_KEY" | tr -d '\r' > "$HOME/.ssh/ci_key"
          printf '%s\n' "$HOST_KEY" > "$HOME/.ssh/known_hosts"
          echo "deploying $SRV_NAME $SRV_REL -> $SRV_SITE"
          ssh -i "$HOME/.ssh/ci_key" \
              -o IdentitiesOnly=yes -o BatchMode=yes \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              -o ConnectTimeout=20 \
              "$SRV_USER@$SRV_HOST" "ci-deploy $SRV_NAME $SRV_REL $SRV_SITE" \
              < "$RUNNER_TEMP/site.tgz"
          echo "deployed $SRV_NAME $SRV_REL"

      - name: Remove the key
        if: always()
        run: rm -f "$HOME/.ssh/ci_key"
